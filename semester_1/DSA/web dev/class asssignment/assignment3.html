<!DOCTYPE html>
<html>
    <head>
        <title>
            register
        </title>
        <link rel="stylesheet" href="assingment3.css">
    </head>
    <body>
        <div class="main-container">

            <form>
            <div class="header">
                <h1>Software Developer- Job application </h1>
            </div>


            <div class="main-content">
                <div class="heading">
                    <h2>Personal details</h2>
                </div>
                <div>
                    

                    <label>Full Name</label>
                    <input type="text" id="name" placeholder="Enter your name"><br>
                    <label>Email adddress</label>
                    <input type="email" id="email" placeholder="Enter your email" ><br>
                    <label>Phone no.</label>
                    <input type="tel" id="telephone" placeholder="Enter your phone no."><br>
                    <label>Current City</label>
                    <input type="text" id="city" placeholder="City"><br>
                </div>

                <hr>

                 <div class="heading">
                    <h2>Eductional Background</h2>
                </div>
                <div>
                    

                    <label>Higher Eduction</label>
                    <select size="1">
                        <option vlaue="B.tech">B.tech</option>
                        <option vlaue="MCA">MCA</option>
                        <option vlaue="MSC">MSc</option>
                        <option vlaue="pHD">Phd</option>
                    </select><br>

                    <label>Year of completion</label>
                    <input type="date" id="year" placeholder="date"><br>
                    <label>All over cgpa</label>
                    <input type="number" id="cgpa" placeholder="CGPA"><br>
                </div>
                <hr>

                 <div class="heading">
                    <h2>Skills and experiences</h2>
                </div>
                <div>
                    

                    <label>Technicall Skills(select multiple)</label><br>
                    <input type="checkbox" id="checkbox" >
                    <label>HTML</label><br>
                    <input type="checkbox" id="checkbox" >
                    <label>CSS</label><br>
                    <input type="checkbox" id="checkbox" >
                    <label>Python</label><br>
                    <input type="checkbox" id="checkbox" >
                    <label>C++</label><br>
                    <input type="checkbox" id="checkbox" >
                    <label>SQL</label>


                    <label>github profile url(if any)</label>
                    <input type="url" id="github" placeholder="github"><br>
                    <label>linkedin profile url(if any)</label>
                    <input type="link" id="linkedin" placeholder="linkedin" ><br>
                    
                </div>
                <hr>
                <div class="heading">
                    <h2>Position Information</h2>
                </div>

                <div>
                    

                    <label>Role interested In</label><br>
                    <input type="radio" id="role" name="role" >
                    <label>Frontend Developer</label><br>
                    <input type="radio" id="role"  name="role">
                    <label>Backend Developer</label><br>
                    <input type="radio" id="role" name="role">
                    <label>Full-stack Developer</label><br>

                    <label>Expected salary in lpa</label>
                    <input type="number" id="salary" placeholder="salary"><br>

                    <label>Notice Period</label><br>
                    <input type="radio" id="role" name="period" >
                    <label>Immediate</label><br>
                    <input type="radio" id="role"  name="period">
                    <label>One month</label><br>
                    <input type="radio" id="role" name="period">
                    <label>two month</label><br>

                    

                </div>

                <hr>
                <div class="heading">
                    <h2>Cover Letter</h2>
                </div>


                <div>
                    

                    <label>why are you good for this role :</label><br>
                    <input type="text" class="cover-text">

                    
                </div>
                <hr>

                <div class="heading">
                    <h2>Declaration</h2>
                </div>
                <div>

                    <input type="checkbox" id="checkbox" >
                    <label>I hereby declare that the provided information is correct</label>
                </div>

                <div>
                    <button type="submit">Submit Application</button>
                    <button type="reset">Clear All</button>
                </div>
                
            </div>

        </div>
    </body>
</html>
