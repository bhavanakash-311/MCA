<!DOCTYPE html>
<html>

<head>
    <title>
        Registration page
    </title>

    <link rel="stylesheet" href="assignment2.css">
</head>

<body>

    <div class="main container">



        <div class="sub-container">
            <div></div>
            <div class="main-head">
                <div>
                    <img class=" std-image" src="download.png" alt="student-logo">
                </div>

                <div class="head-text">

                    <p class="registration-heading">Student Registration</p>
                    <p class="registration-subheading"> Create your account to access Examination portal services</p>
                </div>
            </div>
            <div></div>


        </div>

        <div class="p-info">
            <div>
                <img class=" p-info-image" src="download.png" alt="student-logo">
            </div>
            <div>
                <p class="p-info-text">
                    Personal Information
                </p>
            </div>
        </div>


        <div class="container1">
            <div class="container1-left">

                <div>
                    <p class="info-container">Full name</p>
                </div>
                <div>
                    <input type="text" placeholder="Enter your full name" id="name">
                </div>

                <div>
                    <p class="info-container">Gender</p>
                </div>
                <div>
                    <input type="text" placeholder="Select your gender" id="gender">
                </div>

                <div>
                    <p class="info-container">Email ID</p>
                </div>
                <div>
                    <input type="email" placeholder="Enter your institute/personal email" id="email">
                </div>

            </div>

            <div class="container1-right">


                <div>
                    <p class="info-container">Date of Birth</p>
                </div>
                <div>
                    <input type="date" placeholder="dd-mm-yyyy" id="date">
                </div>

                <div>
                    <p class="info-container">Category</p>
                </div>
                <div>
                    <select>
                        <option value="General">General</option>
                        <option value="EWS">EWS</option>
                        <option value="OBC">OBC</option>
                    </select>
                </div>

                <div>
                    <p class="info-container">Mobile Number</p>
                </div>
                <div>
                    <input type="tel" placeholder="Enter 10 digit mobile number" id="telphone">
                </div>

            </div>

        </div>

         <div class="a-info">
            <div>
                <img class=" a-info-image" src="academic.jpg" alt="student-logo">
            </div>
            <div>
                <p class="a-info-text">
                   Academic Information
                </p>
            </div>
        </div>

        <div class="container2">

            <div class="container2-left">

                <div>
                    <p class="info-container">Roll Number</p>
                </div>
                <div>
                    <input type="text" placeholder="Enter roll no" id="roll-no">
                </div>

                <div>
                    <p class="info-container">Department</p>
                </div>
                <div>
                    <select>
                        <option value="">Choose an option</option>
                        <option value="CDS">CDS</option>
                        <option value="CSS">CSS</option>
                        <option value="Physics">Physics</option>
                    </select>
                </div>

                

            </div>

            <div class="container2-right">


                <div>
                    <p class="info-container">Program</p>
                </div>
                <div>
                    <select>
                        <option value="">Choose an option</option>
                        <option value="CDS">CDS</option>
                        <option value="CSS">CSS</option>
                        <option value="Physics">Physics</option>
                    </select>
                </div>

                <div>
                    <p class="info-container">Year of study</p>
                </div>
                <div>
                      <select>
                        <option value="">Choose an option</option>
                        <option value="">2024</option>
                        <option value="">2025</option>
                        <option value="">2026</option>
                    </select>
                </div>

                

            </div>


        </div>
    </div>




</body>

</html>
