<!DOCTYPE html>
<html>
    <head>
        <title>Student Dashboard</title>
        <link rel="stylesheet" href="dashboard.css">
    </head>
    <body>
        <div class="main container">
            <div class="sidebar">
                
                    <a href="" class="sidebar-text"><img class="sidebar-head-img" src="" > Exam portal</a>
                    <a href="" class="sidebar-text"><img class="sidebar-head-img" src="" > Dashboard </a>
                    <a href="" class="sidebar-text"><img class="sidebar-head-img" src="" > Available exam </a>
                    <a href="" class="sidebar-text"><img class="sidebar-head-img" src="" > My result </a>
                    <a href="" class="sidebar-text"><img class="sidebar-head-img" src="" > Exam History </a>
                    <a href="" class="sidebar-text"><img class="sidebar-head-img" src="" > Profile </a>
                    <a href="" class="sidebar-text"><img class="sidebar-head-img" src="" > Notifocation </a>

                    <a href="" class="sidebar-text"><img class="sidebar-head-img" src="" > Log out </a>

                
            </div>

            <div class="right-side">

                <div class="right1">

                    <div class="header">
    
                    <div class="no-content">
                        
                    </div>
                    <div class="notification-bar">
                        <div class="notifications">
    
                            <img class="notification-image" src="pngtree-vector-notification-icon-png-image_4187244.jpg" alt="notifocation-image">
                        </div>
                        <div class="profile">
    
                            <img class="profile-pic" src ="photo.jpg" alt="profile-pic">
                        </div>
                        <div class="profile-name">
    
                            <p class="profile-name">Bhavana</p>
                        </div>
                    </div>
    
    
                    </div>
                </div>

                <div class="right2">

                    <div class="welcome">
                        <h3>Welcome Bhavana</h3>
                        <p>here's what happening with your exam</p>
    
                    </div >

                    <div class="stat">

                        <div class="stat1">
                            <div class="stat-icon">
                                <img src="calendar.jpg" class="stat-icon" alt="stat-icon">
                            </div>
                            <div class="stat-text">
                                <div class="stat-message1">
                                    <p>Upcoming Exam</p>
                                </div>
                                <div class="stat-message2">
                                    <p>3</p>
                                </div>
                            </div>
                        </div>
                        <div class="stat1">
                            <div class="stat-icon">
                                <img src="green tick.webp" class="stat-icon" alt="stat-icon">
                            </div>
                            <div class="stat-text">
                                <div class="stat-message1">
                                    <p>completed Exam</p>
                                </div>
                                <div class="stat-message2">
                                    <p>2</p>
                                </div>
                            </div>
                        </div>
                        <div class="stat1">
                            <div class="stat-icon">
                                <img src="bar icon.webp" class="stat-icon" alt="stat-icon">
                            </div>
                            <div class="stat-text">
                                <div class="stat-message1">
                                    <p>Latest Result</p>
                                </div>
                                <div class="stat-message2">
                                    <p>85%</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="recent-exam">

                        <div class="recent-exam-text">
                            <p>recent exam</p>
                            <p>view All</p>
                        </div>

                        <div class="recent-exam-details">
                            <div class="exam table">

                                <table> 
                                    <tr>

                                        <th>Examdate</th>
                                        <th>Subject</th>
                                        <th>Date</th>
                                        <th>Action</th>
                                    </tr>

                                    <tr>
                                        <td>Data structure</td>
                                        <td>DSA</td>
                                        <td>12/4/2026</td>
                                        
                                    </tr>
                                </table>

                            </div>
                        </div>

                    </div>

                </div>


            </div>

        </div>
    </body>
</html>
