<!DOCTYPE html>
<html>
    <head>
        <title>
            online course
        </title>
        <link rel="stylesheet" href="assignment4.css">
    </head>

    <body>
        <div class="main-container">
            <form>

                <div class="header">
                <h1>Register for online Courses</h1>
            </div>
                <div class="heading">
                    <h2>Student Information</h2>
                </div>
                <div>
                    

                    <label>Full Name</label>
                    <input type="text" id="name" placeholder="Enter your name"><br>
                    <label>Email adddress</label>
                    <input type="email" id="email" placeholder="Enter your email" ><br>
                    <label>Phone no.</label>
                    <input type="tel" id="telephone" placeholder="Enter your phone no."><br>
                    <label>Date of birth</label>
                    <input type="date" id="city" placeholder="dd-mm-yyyy"><br>
                    <label>Current year of study</label><br>
                    <input type="radio" id="study" name="study"> 
                    <label>First year</label> <br>
                    <input type="radio" id="study" name="study"> 
                    <label>Second year</label>    <br>                
                    <input type="radio" id="study" name="study"> 
                    <label>third year</label> <br>
                    <input type="radio" id="study" name="study">
                    <label>Fourth year</label> <br>
                </div>

                <hr>

                 <div class="heading">
                    <h2>Course Selection</h2>
                </div>
                <div>
                    <label>Prefered time slot</label><br>
                    <input type="radio" id="slot" name="slot"> 
                    <label>Morning 8am- 10am</label> <br>
                    <input type="radio" id="slot" name="slot">
                    <label>evening slot 2pm- 4pm</label> <br><br>

                    <label>Mode of learning</label><br>
                    <input type="radio" id="mode" name="mode"> 
                    <label>online</label> <br>
                    <input type="radio" id="mode" name="mode"> 
                    <label>offline</label> <br>
                    <input type="radio" id="mode" name="mode"> 
                    <label>hybrid</label> <br>
                    

                    
                </div>

                <hr>

                <div>
                     <div class="heading">
                    <h2>Additional preferences</h2>
                </div>
                    <label>Area of interest(select multiple)</label><br>
                    <input type="checkbox" id="checkbox" >
                    <label>MAchine Learning</label><br>
                    <input type="checkbox" id="checkbox" >
                    <label>Web application</label><br>
                    <input type="checkbox" id="checkbox" >
                    <label>Mobile Apps</label><br>
                    <input type="checkbox" id="checkbox" >
                    <label>Cybersecurity</label><br>
                    
            
                </div>

                <div>
                     <div class="heading">
                    <h2>Submit</h2>
                </div>
                <div>

                    <input type="checkbox" id="checkbox" >
                    <label>I agree to terms and conditions</label>
                </div>

                 <div>
                    <button type="submit">Submit Application</button>
                    <button type="reset">Clear All</button>
                </div>


            </form>
        </div>
    </body>
</html>
